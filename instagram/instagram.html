        <script>
            const postImg = document.getElementById("postImage");
            const likeBtn = document.getElementById("like-button");
            const likeSvgSp = likeBtn.querySelector(".like-svg-sp");
            const container = postImg.parentElement;
            const LIKE_SVG = `<svg aria-label="Like" viewBox="0 0 48 48" class="like-btn-svg" fill="currentColor" width="128"><title>Like</title><defs><linearGradient gradientTransform="rotate(35)" id="ig_heart_gradient"><stop offset="0%" stop-color="#FF7A00"></stop><stop offset="40%" stop-color="#FF0169"></stop><stop offset="100%" stop-color="#D300C5"></stop></linearGradient></defs><path d="M34.6 3.1c-4.5 0-7.9 1.8-10.6 5.6-2.7-3.7-6.1-5.5-10.6-5.5C6 3.1 0 9.6 0 17.6c0 7.3 5.4 12 10.6 16.5.6.5 1.3 1.1 1.9 1.7l2.3 2c4.4 3.9 6.6 5.9 7.6 6.5.5.3 1.1.5 1.6.5s1.1-.2 1.6-.5c1-.6 2.8-2.2 7.8-6.8l2-1.8c.7-.6 1.3-1.2 2-1.7C42.7 29.6 48 25 48 17.6c0-8-6-14.5-13.4-14.5z" fill="url(#ig_heart_gradient)"></path></svg>`;

            postImg.addEventListener("dblclick", (e) => {
                const rect = postImg.getBoundingClientRect();
                const rectLike = likeBtn.getBoundingClientRect();

                const startX = e.clientX - rect.left;
                const startY = e.clientY - rect.top;


                // target position (center of Like button)
                const endX = rectLike.left + rectLike.width / 2 - rect.left;
                const endY = rectLike.top + rectLike.height / 2 - rect.top;

                //console.log(endX, endY);


                // create heart
                const heart = document.createElement("span");
                heart.innerHTML = LIKE_SVG;
                heart.classList.add("heart");
                heart.style.left = `${startX}px`;
                heart.style.top = `${startY}px`;

                
                const randomRotate = Math.random() * 60 - 30; // -30deg to +30deg
                heart.style.transform = `translate(-50%, -50%) scale(0) rotate(${randomRotate}deg)`;
                

                container.appendChild(heart);

                // POP-IN effect
                requestAnimationFrame(() => {
                    heart.style.transition = `
                        transform 0.2s cubic-bezier(1, 1, 0.2, 1),
                        opacity 0.2s ease-in`;
                    heart.style.transform = `translate(-50%, -50%) scale(1) rotate(${randomRotate}deg)`;
                    heart.style.opacity = "1";
                });

                // CURVED motion control point (midway arc)
                const controlX = (startX + endX) / 2 + (Math.random() * 60 - 30);
                const controlY = Math.min(startY, endY) - 80; // curve upward

                // Animate along curve with requestAnimationFrame
                const duration = 600;
                const startTime = performance.now();

                // iOS STYLE SPRING EASING
                function springEase(t) {
                return 1 - Math.cos(t * Math.PI * 1.2) * Math.exp(-t * 6);
                }

                function animateHeart(time) {
                    const elapsed = time - startTime;
                    const progress = Math.min((time - startTime) / duration, 1);
                    const t = progress;

                    // STRAIGHT LINE INTERPOLATION (NO BEZIER)
                    const x = startX + (endX - startX) * t;
                    const y = startY + (endY - startY) * t;
                    
                    
                    // Apply easing for smoother motion
                    const easeOut = 1 - Math.pow(1 - t, 1.5);

                    heart.style.left = `${x}px`;
                    heart.style.top = `${y}px`;

                    // Scale down and fade out as it moves
                    heart.style.transform = `translate(-50%, -50%) scale(${1.4 - easeOut}) rotate(${randomRotate}deg)`;
                    heart.style.opacity = "1";
                    

                    if (progress < 1) {
                        requestAnimationFrame(animateHeart);
                    } else {
                        // CHANGE LIKE BUTTON ONLY AFTER ARRIVAL
                        likeSvgSp.innerHTML = LIKE_SVG;
                        heart.style.transform = `translate(-50%, -50%) scale(0.4) rotate(${randomRotate}deg)`;
                        heart.style.opacity = "0";
                        
                    }
                }

                setTimeout(() => requestAnimationFrame(animateHeart), 200);

            });
        </script>
